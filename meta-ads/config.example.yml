# Meta ads configuration: ids and numbers the script/meta-*.ts jobs read.
# Copy to meta-ads/config.yml (gitignored) and fill in as docs/meta-ads.md phases produce each value.
# Ids are not secrets; the access token is, and lives only in .env as META_ACCESS_TOKEN.

api_version: v23.0            # Graph API version used in every call; bump when Meta retires it (app dashboard warns)

ad_account_id: act_817058156574069   # phase 1 step 1 (the number the campaign export is named after)
pixel_id: "5349931195130820"          # phase 1 step 2
page_id: ""                           # phase 1 step 3
instagram_account_id: ""              # phase 1 step 3
app_id: ""                            # phase 1 step 5
system_user_id: ""                    # phase 7 prelude step 3, the "iyfadsbot" system user (Business Suite, Users, System users)

campaign_id: ""                       # phase 3 step 1, the renamed "IYF stages" campaign

adsets:
  cold: ""                            # phase 3 step 3, the existing trained ad set, renamed
  warm: ""                            # phase 3 step 4
  intent: ""                          # phase 3 step 4
  buyers: ""                          # phase 3 step 4

audiences:
  show_clickers: ""                   # phase 2, website audience on TicketRedirect, 180 days
  site_visitors: ""                   # phase 2, website audience, all visitors, 180 days
  ig_engagers: ""                     # phase 2, Instagram engagers, 365 days
  fb_engagers: ""                     # phase 2, Facebook Page engagers, 365 days
  buyers_recent: ""                   # phase 2, customer list from meta-ads/lists/buyers-recent-*.csv
  buyers_lapsed: ""                   # phase 2, customer list from meta-ads/lists/buyers-lapsed-*.csv (empty if merged)
  buyers_lookalike: ""                # phase 2 step 5, 1% Switzerland, experiments only

custom_conversion_id: ""              # phase 2 step 2, "Ticket click" on TicketRedirect

# Budgets in CHF per day. Base is the always-on figure; ramp is the figure during the
# Tuesday 06:00 to show day 23:00 window that script/meta-schedule.ts writes (never on cold).
budgets:
  cold:   { base: 3 }
  warm:   { base: 3, ramp: 10 }
  intent: { base: 2, ramp: 5 }
  buyers: { base: 2, ramp: 8 }
monthly_cap_chf: 500

# Which shows get a ramp. Dates always come from _data/calendar.yml, never from here.
ramp_shows: [comedybrew]

# Lineup ad (script/meta-lineup-ad.ts)
lineup:
  grist_table: Lineups              # columns: date, show, link, style
  default_style: classic            # Flyer Maker style key when the row leaves style empty
  fallback: week                    # what to post when no row exists by Tuesday 09:00: the week story
  ends_at: "18:00"                  # Zürich time on show day when the Buyers ad set stops (meta-lineup-ad.ts sets end_time)

# The old ad set (the 2024 carousel, kept running by Harry's choice, 2026-09-13). meta-insights.ts
# reports it; meta-adsets.ts and meta-insights.ts --apply never write to it.
old_adset_id: ""

# Targeting per bank ad set, written by script/meta-adsets.ts (dry-run diff by default, --apply
# writes). Keys under include/exclude are the audience keys above. `locales` are Meta locale ids
# (the old ad set's 31 languages; read them with GET /<adset>/targetingsentencelines).
targeting:
  cold:
    location: { city_key: "313044", radius_km: 30, location_types: [home, recent] }   # Zürich
    ages: [21, 50]
    locales: [2, 4, 5, 6, 7, 8, 9, 10, 13, 14, 15, 16, 17, 18, 19, 23, 24, 31, 32, 33, 34, 38, 39, 42, 44, 52, 54, 58, 79, 84, 87]
    include: []
    exclude: [ig_engagers, fb_engagers, site_visitors, show_clickers, buyers_recent, buyers_lapsed]
    optimization: LANDING_PAGE_VIEWS
  warm:
    location: { countries: [CH], location_types: [home, recent] }
    ages: [18, 65]
    include: [ig_engagers, fb_engagers]
    exclude: [site_visitors, show_clickers, buyers_recent, buyers_lapsed]
    optimization: LANDING_PAGE_VIEWS
  intent:
    location: { countries: [CH], location_types: [home, recent] }
    ages: [18, 65]
    include: [site_visitors, show_clickers]     # show_clickers alone is under 1,000 (2026-09-13); dropped with a warning if Meta rejects it
    exclude: [buyers_recent, buyers_lapsed]
    optimization: LANDING_PAGE_VIEWS

# Readout rules for script/meta-insights.ts (plan: meta-ads/creative-bank-plan.md).
insights:
  ticket_floor: 10            # ticket clicks in the window before cost per ticket click ranks an ad
  lpv_floor: 30               # landing page views before cost per landing page view ranks it
  retire_factor: 1.5          # worse than this times the ad set median past the floor: retire
  max_retire_per_adset: 2
  starved_after_days: 28      # under the floor this long while a sibling passed it: starved
  frequency_flag: 3.5         # 7-day frequency above this flags the ad set
  # Meta recommendations already decided on the Saturday review (type as the API names it, the
  # object as the readout names it). They still print, marked accepted, after the open ones.
  accepted_recommendations:
    - { type: REELS_PC_RECOMMENDATION, object: adset cold, reason: "9:16 video with audio waits for the two phone clips (W8, I2); the 9:16 image is in place" }
    - { type: REELS_PC_RECOMMENDATION, object: adset warm, reason: "same, the clips" }
    - { type: REELS_PC_RECOMMENDATION, object: adset intent, reason: "same, the clips" }
    - { type: REELS_PC_RECOMMENDATION, object: adset old, reason: "the 2024 carousel stays as it is, review in a month" }
    - { type: "1942001", object: ad cold-C3, reason: "German copy on purpose (the Swiss person); the set targets German among its 31 languages; Meta's confidence is LOW" }

# Comedy Brew sales tracking (script/eventfrog-sales.ts, strategy 2026-09-13). The Eventfrog key lives in .env as
# EVENTFROG_ORGANIZER and is used read-only whatever its rights (the client has one verb). Thresholds are shares of
# the blended net ticket price so they move with the student mix.
comedybrew:
  show: comedybrew                  # calendar slug, also the /reports/ file the site clicks come from
  group_id: "7132091334890862636"   # the Comedy Brew event group on Eventfrog (the number in the group ticket URL)
  capacity_override: 0              # 0 = read totalNumberOfTickets from the API
  fixed_cost_chf: 0                 # what a night costs before tickets (room, host, comedians, drinks); 0 = nothing per show
  per_ticket_cost_chf: 0            # Eventfrog fee per ticket if an invoice ever shows one (payouts equal gross so far)
  door_sales: none                  # none | cash; cash adds "the sales figure is a floor" to every readout
  new_buyer_value_chf: 0            # credit per first-time buyer beyond the ticket; 0 keeps profit strictly per night
  door_reserve: 4                   # seats kept back for comps, guests and door cash; the guard line is capacity minus this
  seats_left_ramp_stop: 6           # late backstop: at or under this many seats left the ramp stops
  ramp_warn_share: 0.8              # profit guard: ramp francs per extra ticket above 0.8 x blended net halves the ramp
  ramp_stop_share: 1.0              # above 1.0 x blended net the ramp stops
  ramp_restore_share: 0.6           # a cut ramp comes back only under this, two clean weeks in a row
  weekly_envelope_chf: 115          # the monthly cap spread over the weeks (review line only)
  student_title: student            # ticket category title fragment that marks the student sub-category
