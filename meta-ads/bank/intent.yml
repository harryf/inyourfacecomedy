    person: The one worried about getting home
    body: "Still deciding? The last train home is after the show and the door is two minutes from Central."
    title: "The last train is after the show"
    image: { style: station, headline: "Still deciding? The last train is after the show.", sub: "Show ends 21:30 | Central, two minutes on foot | Trains until after midnight" }
