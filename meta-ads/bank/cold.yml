# The Cold bank: people who have never heard of us (meta-ads/creative-bank-plan.md).
# One ad per concept: one body (125 characters or fewer), one headline (under 40), one
# description, one image. Evergreen: no dates, no comedian names, no prices, one sentence
# that names a person, nothing that reads as "we watched you", no em dashes.
# image.style is an /adcard/ look (photo, swiss, type, chalk, station, logo); image.photo a
# gallery path for the photo look; image.headline and image.sub are what the card paints.
# THE RULE (2026-09-26, from the two ads that work, C7 and W6): every new concept is the photo
# look with ONE LAUGHING AUDIENCE FACE, large, and a headline that reads as the caption of that
# picture. image.focus: [x, y] (0 to 1 from the photo's top left) names the face so the 4:5 and
# 9:16 crops keep it; a face below 0.5 of the photo's height ends up under the headline, pick
# another photo. The crowd has to be visible behind the face (a lone laugher on a plain
# background is out). The other looks (swiss, type, chalk, station, logo) were removed from the
# bank on 2026-09-26 with their ads; only C1, C2, C6 keep an older photo card.
# status: live (has an ad, on), resting (has an ad, paused for this round, comes back), bench
# (no ad yet, waiting for a slot), retired (paused by the readout). `meta-bank.ts --sync` makes Meta match.
adset: cold
link: { show: comedybrew, utm_campaign: cold }
description: "English stand-up, every Thursday"

concepts:
