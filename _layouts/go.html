<!DOCTYPE html>
<!--
  Bare-metal layout for the /go/ campaign-link redirector (see docs/campaign-links.md).
  Deliberately NOT the site theme: no 110KB CSS bundle, no navbar/footer, no GTM,
  no Clarity, no main.min.js. The page exists for ~300ms to let GA record the
  UTM-tagged visit before passing the visitor to Eventfrog, so it carries its own
  inline gtag config (main.min.js normally does this, deferred - far too late here)
  and preconnects to the two hosts the visitor is about to hit.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | IN YOUR FACE Comedy</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="{{ page.description }}">
    <meta property="og:title" content="IN YOUR FACE Comedy tickets">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="{{ site.url }}/assets/img/thumbs/inyourface_thumb.png">
    <link rel="preconnect" href="https://eventfrog.ch">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://connect.facebook.net">
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // Same page context the theme pages set (_includes/ga-page-context.liquid): the
      // page_view on /go/ is grouped as "go" and carries the show slug from the query, so
      // campaign landings never mix with real show-page attention in Pages reports.
      gtag('set', {
        content_group: 'go',
        show: (new URLSearchParams(location.search).get('show') || '(unknown)').toLowerCase().slice(0, 64)
      });
      // Live host only, like head.liquid: previews and local builds stay out of GA, and so
      // does a browser that once opened a page with ?notrack=1 (docs/analytics.md).
      var iyfTrack = true;
      try { iyfTrack = localStorage.getItem('iyf-notrack') !== '1'; } catch (e) {}
      if (iyfTrack && /(^|\.)inyourfacecomedy\.ch$/.test(location.hostname)) gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
    {% if site.meta_pixel %}
    <!-- Meta Pixel: the loader is a copy of the snippet in _includes/default/head.liquid
         (this layout skips the theme head on purpose). Unlike the theme pages it is gated on
         the live host and the ?notrack=1 flag, the same way gtag is above, so previews and the
         promoter's own clicks stay out of the Meta audiences. The redirect script then fires
         a TicketRedirect custom event (docs/campaign-links.md, "Capturing the UTM tags"). -->
    <script>
      (function () {
        var track = true;
        try { track = localStorage.getItem('iyf-notrack') !== '1'; } catch (e) {}
        if (!track || !/(^|\.)inyourfacecomedy\.ch$/.test(location.hostname)) return;
        !function(f, b, e, v, n, t, s) {
          if (f.fbq) { return; }
          n = f.fbq = function() { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
          if (!f._fbq) { f._fbq = n; }
          n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
          t = b.createElement(e); t.async = !0; t.src = v;
          s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s)
        }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', {{ site.meta_pixel }});
        fbq('track', 'PageView');
      })();
    </script>
    {% endif %}
    <style>
      /* Values mirror --brand-red / --brand-cream in _sass/base/_variables.scss
         (this layout deliberately skips the CSS bundle, so the tokens are restated). */
      :root { --brand-red: #E53935; --brand-cream: #FFF3E0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             margin: 0; padding: 4rem 1.5rem; text-align: center; }
      .go-redirect__status { font-size: 1.2rem; margin: 0 0 1.5rem; }
      .go-redirect__manual a { display: inline-block; padding: 0.7rem 1.4rem; border-radius: 6px;
             background: var(--brand-red); color: var(--brand-cream); text-decoration: none; font-weight: 700; }
      .go-redirect__noscript { color: #667; }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
